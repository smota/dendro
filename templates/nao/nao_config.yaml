# Nao Semantic Model & Analytics Configuration for Dendro
# Optimized for DuckDB Columnar In-Memory Processing & Conversational AI
version: 2

data_source:
  type: duckdb
  path: "dendro.duckdb"
  options:
    threads: 4
    memory_limit: "2GB"

models:
  # ==========================================================
  # DIMENSION: SEATS (Fleet Seats)
  # ==========================================================
  - name: dim_seats
    table: dim_seats
    description: "Dimension of agent seats across autonomous fleet rigs"
    dimensions:
      - name: seat_id
        type: string
        primary_key: true
        description: "Unique seat identifier (e.g., dev-build@dendro-dev)"
      - name: rig_id
        type: string
        description: "Rig / squad name (e.g., dendro-dev, agentflow-dev)"
      - name: logical_id
        type: string
        description: "Logical role identifier (e.g., build, arch, qa, review)"
      - name: role
        type: string
        description: "Functional role (builder, architect, reviewer, qa, pm)"
      - name: runtime
        type: string
        description: "Execution harness / runtime (claude-code, codex, pi)"
      - name: model
        type: string
        description: "Model used by the seat (e.g., grok-cli/grok-4.7, gpt-6.1)"
    metrics:
      - name: total_seats
        sql: "COUNT(DISTINCT seat_id)"
        description: "Total active seats in the fleet"

  # ==========================================================
  # FACT: SEAT ACTIVITY & IDLE TIMES (Question 1 - Layer 1)
  # ==========================================================
  - name: fct_seat_activity
    table: fct_seat_activity
    description: "Seat activity intervals, idle time, and waiting duration"
    dimensions:
      - name: id
        type: string
        primary_key: true
      - name: seat_id
        type: string
      - name: rig_id
        type: string
      - name: recorded_date
        type: date
        sql: "CAST(window_start AS DATE)"
    metrics:
      - name: total_active_hours
        sql: "SUM(active_seconds) / 3600.0"
        description: "Total time spent actively executing tool turns"
      - name: total_idle_with_work_hours
        sql: "SUM(idle_with_work_seconds) / 3600.0"
        description: "Idle time while queue items were pending for the seat (operational waste)"
      - name: total_idle_no_work_hours
        sql: "SUM(idle_no_work_seconds) / 3600.0"
        description: "Idle time due to empty queue (available capacity)"
      - name: waiting_human_hours
        sql: "SUM(waiting_human_seconds) / 3600.0"
        description: "Time blocked waiting on human input or external gates (needs_input)"
      - name: waste_ratio_pct
        sql: "ROUND(SUM(idle_with_work_seconds) * 100.0 / NULLIF(SUM(active_seconds + idle_with_work_seconds + idle_no_work_seconds), 0), 2)"
        description: "Waste percentage: idle time with pending work divided by total active and idle time"

  # ==========================================================
  # FACT: HANDOFF FLOW & REWORK (Question 2 - Layer 2)
  # ==========================================================
  - name: fct_handoffs
    table: fct_handoffs
    description: "Queue item transitions between seats, measuring rework and context bloat"
    dimensions:
      - name: handoff_id
        type: string
        primary_key: true
      - name: rig_id
        type: string
      - name: from_seat
        type: string
      - name: to_seat
        type: string
      - name: is_rework
        type: boolean
        description: "True if item returned to an upstream builder in the chain (e.g., QA/Review -> Dev)"
    metrics:
      - name: total_handoffs
        sql: "COUNT(*)"
        description: "Total volume of recorded handoffs"
      - name: rework_count
        sql: "COUNT(CASE WHEN is_rework THEN 1 END)"
        description: "Count of return rework transitions"
      - name: rework_rate_pct
        sql: "ROUND(COUNT(CASE WHEN is_rework THEN 1 END) * 100.0 / NULLIF(COUNT(*), 0), 2)"
        description: "Squad rework rate (percentage of handoffs returned)"
      - name: avg_queue_wait_seconds
        sql: "ROUND(AVG(queue_wait_seconds), 1)"
        description: "Average queue wait latency until destination seat claims the item"
      - name: avg_intake_tokens
        sql: "ROUND(AVG(intake_token_cost), 0)"
        description: "Average tokens consumed by destination seat to absorb context before first action"

  # ==========================================================
  # FACT: TOKEN BURN & COSTS (Question 3 - Layer 3)
  # ==========================================================
  - name: fct_token_burn
    table: fct_token_burn
    description: "Token consumption and model costs attributed by mission, rig, and seat"
    dimensions:
      - name: burn_id
        type: string
        primary_key: true
      - name: mission_id
        type: string
      - name: seat_id
        type: string
      - name: rig_id
        type: string
      - name: model_name
        type: string
    metrics:
      - name: total_input_tokens
        sql: "SUM(input_tokens)"
      - name: total_output_tokens
        sql: "SUM(output_tokens)"
      - name: total_cache_read_tokens
        sql: "SUM(cache_read_tokens)"
      - name: total_cost_usd
        sql: "ROUND(SUM(cost_usd), 4)"
        description: "Total accumulated model investment in USD"
      - name: avg_cost_per_mission
        sql: "ROUND(SUM(cost_usd) / NULLIF(COUNT(DISTINCT mission_id), 0), 4)"

  # ==========================================================
  # FACT: TOOL RETRY LOOPS (Question 3 - Loop Detection)
  # ==========================================================
  - name: fct_tool_loops
    table: fct_tool_loops
    description: "Detection of repetitive failing tool calls and sterile retry loops"
    dimensions:
      - name: loop_id
        type: string
        primary_key: true
      - name: seat_id
        type: string
      - name: tool_name
        type: string
      - name: has_error
        type: boolean
    metrics:
      - name: loop_events_count
        sql: "COUNT(*)"
        description: "Occurrences of looped command sequences"
      - name: failed_loops_count
        sql: "COUNT(CASE WHEN has_error THEN 1 END)"
        description: "Loops that repeatedly failed"

  # ==========================================================
  # FACT: GOVERNANCE DECISION INDICES (Indices M1 to M4)
  # ==========================================================
  - name: fct_decision_metrics
    table: fct_decision_metrics
    description: "Consolidated executive governance indicators for the squad"
    dimensions:
      - name: rig_id
        type: string
        primary_key: true
    metrics:
      - name: seat_yield_ratio
        sql: "AVG(seat_yield)"
        description: "M1: Average seat yield (production vs active time)"
      - name: handoff_efficiency_pct
        sql: "ROUND(AVG(handoff_efficiency) * 100.0, 1)"
        description: "M2: Average handoff efficiency (frictionless transfers)"
      - name: build_rework_pct
        sql: "ROUND(AVG(rework_rate) * 100.0, 1)"
        description: "M3: Build rework rate across development pipeline"
      - name: skill_exposure_pct
        sql: "ROUND(AVG(skill_exposure) * 100.0, 1)"
        description: "M4: Percentage of turns exposed to specialized skills"
