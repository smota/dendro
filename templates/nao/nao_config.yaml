# Nao Analytics Configuration for Dendro
version: 1
data_source:
  type: duckdb
  path: "dendro.duckdb"

models:
  - name: fct_sessions
    table: fct_sessions
    description: "Canonical execution sessions across all local AI coding agents"
    dimensions:
      - name: session_id
        type: string
        primary_key: true
      - name: harness_name
        type: string
        description: "Agent harness (claude-code, codex, agy, grok, pi)"
      - name: project_name
        type: string
      - name: rig_name
        type: string
        description: "Orchestration rig name if orchestrated by OpenRig, or standalone"
      - name: seat_role
        type: string
        description: "Assigned seat role (builder, reviewer, arch, qa, etc.)"
      - name: status
        type: string

    metrics:
      - name: total_cost_usd
        sql: "SUM(estimated_cost_usd)"
        description: "Total cost across sessions in USD"
      - name: total_sessions
        sql: "COUNT(*)"
        description: "Total number of agent sessions"
      - name: avg_duration_minutes
        sql: "AVG(duration_seconds) / 60.0"
        description: "Average session duration in minutes"
      - name: total_tokens
        sql: "SUM(input_tokens + output_tokens)"
        description: "Total tokens consumed"

  - name: fct_tool_calls
    table: fct_tool_calls
    description: "Granular tool calls executed by agents (bash, edit_file, view_file)"
    dimensions:
      - name: call_id
        type: string
        primary_key: true
      - name: tool_name
        type: string
      - name: status
        type: string

    metrics:
      - name: total_tool_calls
        sql: "COUNT(*)"
      - name: failure_rate
        sql: "COUNT(CASE WHEN status = 'failure' THEN 1 END) * 1.0 / COUNT(*)"
        description: "Percentage of tool calls that returned an error"
