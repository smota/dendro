# Nao Dashboard: Resources, Costs & Retry Loops (Question 3)
dashboard:
  id: cost_and_loops
  title: "Resource & Cost Mastery with Loop Diagnostics"
  description: "Token burn by mission/seat and early detection of sterile tool loops"

queries:
  - id: mission_token_burn
    title: "Token Consumption & Spend per Mission"
    nl_prompt: "Which mission consumed the most tokens and what was its dollar spend?"
    sql: >
      SELECT 
        mission_id,
        rig_id,
        COUNT(DISTINCT seat_id) AS seats_involved,
        SUM(input_tokens) AS total_input,
        SUM(output_tokens) AS total_output,
        SUM(cache_read_tokens) AS total_cache_read,
        ROUND(SUM(cost_usd), 4) AS cost_usd
      FROM fct_token_burn
      GROUP BY mission_id, rig_id
      ORDER BY cost_usd DESC;

  - id: retry_loops_detected
    title: "Repetitive Commands in Failing Retry Loops"
    nl_prompt: "Which seats entered loops repeating failing bash commands?"
    sql: >
      SELECT 
        seat_id,
        tool_name,
        repeat_count,
        has_error
      FROM fct_tool_loops
      WHERE has_error = true AND repeat_count >= 2
      ORDER BY repeat_count DESC;
