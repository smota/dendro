[tools]
uv = "0.13.8"
node = "26.13.1"
pnpm = "12.18.0"

[env]
RUSTUP_TOOLCHAIN = "1.98.1"
UV_PYTHON_DOWNLOADS = "never"

[tasks.verify]
description = "Native Rust and governance checks, then isolated Linux Rust gates"
raw = true
tools = { dagger = "0.21.12" }
run = ["mise run verify:guard", "uv run tools/validation/verify.py", "mise run verify:linux"]

[tasks."verify:guard"]
description = "Cheap validation-boundary regressions; no Rust compilation or SDK"
run = ["uv run tools/validation/test_windows_guard.py -v", "uv run tools/validation/test_validation_inputs.py -v"]

[tasks."verify:dependency-automation"]
description = "Require real Dependabot commit authorship and allowed paths against development"
run = "uv run tools/validation/verify.py --dependency-automation --base development"

[tasks."verify:fast"]
description = "Formatting and existing governance/site checks"
run = "uv run tools/validation/verify.py --fast"

[tasks."verify:windows"]
description = "Four Rust gates on actual native Windows"
run = "uv run tools/validation/verify.py --windows"

[tasks."verify:linux"]
description = "Dagger Linux build gates and required full native ext4 workspace tests"
raw = true
tools = { dagger = "0.21.12" }
run = ["uv run tools/validation/windows_guard.py --external -- dagger run -- uv run tools/validation/pipeline.py", "uv run tools/validation/windows_guard.py --external -- uv run tools/validation/native_linux.py"]

[tasks."verify:native-fixture"]
description = "Actual two-volume fixture; requires disposable FOUNDATION_CROSS_VOLUME_SOURCE/DEST"
run = "uv run tools/validation/verify.py --native-fixture"

[tasks."verify:historical"]
description = "Native Linux/WSL ext4 historical proof; pass --scratch and --target-dir"
run = "uv run tools/validation/historical.py"

[tasks."verify:release-candidate"]
description = "Existing release-note presence and workspace check gate"
run = "uv run tools/validation/verify.py --release-candidate"
