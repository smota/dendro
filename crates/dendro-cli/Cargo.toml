[package]
name = "dendro-cli"
description = "Dendro CLI — local-first AI Fleet Intelligence and Governance engine."
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
readme = "README.md"
authors.workspace = true
repository.workspace = true

[lib]
name = "dendro_cli"
path = "src/lib.rs"

[[bin]]
name = "dendro"
path = "src/main.rs"

[dependencies]
dendro-core.workspace = true
dendro-connectors.workspace = true
dendro-resolver.workspace = true
dendro-watcher.workspace = true

tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tachyonfx.workspace = true
futures.workspace = true
chrono.workspace = true
rand.workspace = true
duckdb.workspace = true
hex.workspace = true
thiserror.workspace = true
hmac.workspace = true
sha2.workspace = true
