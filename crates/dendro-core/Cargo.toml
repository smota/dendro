[package]
name = "dendro-core"
description = "Core domain models, storage engine, and telemetry facts for Dendro."
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
readme = "README.md"
authors.workspace = true
repository.workspace = true

[dependencies]
dendro-platform-policy.workspace = true
serde.workspace = true
serde_json.workspace = true
duckdb.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
tracing.workspace = true
hmac.workspace = true
sha2.workspace = true
rand.workspace = true
fd-lock.workspace = true
libc.workspace = true
hex.workspace = true
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
dendro-windows-private-io.workspace = true
win-custody = "=0.1.1"
winapi-util = "=0.1.11"
bound-platform = "=0.2.1"
windows-namespace-request-sys = "=0.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dendro_platform_v080_harness)"] }
