[workspace]
resolver = "2"
members = [
    "crates/dendro-core",
    "crates/dendro-platform-policy",
    "crates/dendro-windows-private-io",
    "crates/dendro-connectors",
    "crates/dendro-resolver",
    "crates/dendro-watcher",
    "crates/dendro-cli",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
authors = ["smota"]
license = "FSL-1.1-Apache-2.0"
repository = "https://github.com/smota/dendro"
readme = "README.md"
keywords = ["agents", "ai-fleet-intelligence", "operational-intelligence", "fleet-governance", "duckdb", "openrig"]

[workspace.dependencies]
dendro-platform-policy = { path = "crates/dendro-platform-policy", version = "0.9.0" }
dendro-windows-private-io = { path = "crates/dendro-windows-private-io", version = "0.9.0" }
dendro-core = { path = "crates/dendro-core", version = "0.9.0" }
dendro-connectors = { path = "crates/dendro-connectors", version = "0.9.0" }
dendro-resolver = { path = "crates/dendro-resolver", version = "0.9.0" }
dendro-watcher = { path = "crates/dendro-watcher", version = "0.9.0" }

tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
fd-lock = "4"
libc = "0.2"
hex = "0.4"
duckdb = { version = "~1.20000.0", features = ["bundled", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6.1"
notify-debouncer-mini = "0.4"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tachyonfx = "0.25"
futures = "0.3"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
