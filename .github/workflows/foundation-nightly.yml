name: Nightly full foundation proof

# Schedules only fire from the default branch, so this reaches main with a release.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch full development proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run foundation.yml --repo "$GITHUB_REPOSITORY" --ref development -f scope=full
