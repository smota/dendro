<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Dendro mark">
  <title>Dendro — Concentric growth rings for AI fleet intelligence</title>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#0E1714" stroke="#243B33" stroke-width="2"/>
  <!-- Radial observation axis ticks -->
  <g stroke="#29443A" stroke-width="2" stroke-linecap="round">
    <line x1="64" y1="14" x2="64" y2="24"/>
    <line x1="64" y1="104" x2="64" y2="114"/>
    <line x1="14" y1="64" x2="24" y2="64"/>
    <line x1="104" y1="64" x2="114" y2="64"/>
  </g>
  <!-- Outer growth ring: Active seat band (Emerald) -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-dasharray="212 52" transform="rotate(-35 64 64)"/>
  <!-- Middle growth ring: Handoff & queue flow (Cyan) -->
  <circle cx="64" cy="64" r="29" fill="none" stroke="#06B6D4" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="138 44" transform="rotate(40 64 64)"/>
  <!-- Inner growth ring: Rework & return signal (Amber) -->
  <circle cx="64" cy="64" r="17" fill="none" stroke="#F2A541" stroke-width="5" stroke-linecap="round" stroke-dasharray="78 29" transform="rotate(-110 64 64)"/>
  <!-- Heartwood core: DuckDB analytical truth -->
  <circle cx="64" cy="64" r="6" fill="#F4EFE6"/>
</svg>
